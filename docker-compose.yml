# OPEN-ATLAS — full-stack container orchestration.
#
#   docker compose up --build
#
# Services:
#   terminal-ui      React/Vite terminal            -> http://localhost:5173
#   matching-engine  Rust FIX 4.4 gateway + LOB     -> tcp  localhost:9101
#   quant-engine     Python quant / pricing API     -> http://localhost:9102
#   redis            Order/quote state cache        -> internal network only
#   timescaledb      Tick & trade persistence       -> internal network only
#
# Setup: cp .env.example .env and set a real POSTGRES_PASSWORD first.

services:
  terminal-ui:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/terminal-ui:/app
      - ui_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_FIX_GATEWAY_URL: "http://localhost:9101"
      VITE_QUANT_API_URL: "http://localhost:9102"
    depends_on:
      - matching-engine
      - quant-engine
    networks:
      - atlas-net

  matching-engine:
    build:
      context: ./core/matching-engine
      dockerfile: Dockerfile
    ports:
      - "9101:9101"
    environment:
      RUST_LOG: "info"
    depends_on:
      - redis
    networks:
      - atlas-net

  quant-engine:
    build:
      context: ./quant-engine
      dockerfile: Dockerfile
    ports:
      - "9102:9102"
    depends_on:
      - timescaledb
    networks:
      - atlas-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    # No host port published: reachable only on the internal network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - atlas-net

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    # No host port published: reachable only on the internal network.
    # The password comes from the environment (.env) — never commit it.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-open_atlas}
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d open_atlas"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - atlas-net

volumes:
  redis_data:
  tsdb_data:
  ui_node_modules:

networks:
  atlas-net:
    driver: bridge
