[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-atlas-market-data"
version = "0.1.0"
description = "OPEN-ATLAS live market-data pipeline (AR-1): ingestion -> normalizer -> Redis -> WebSocket fan-out. Read-only by construction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "websockets>=12",
    "redis>=5",
]

[project.optional-dependencies]
test = ["pytest>=7", "fakeredis>=2"]

[tool.setuptools.packages.find]
include = ["market_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
